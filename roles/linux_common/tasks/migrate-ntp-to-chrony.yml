---
- name: Gather service facts.
  ansible.builtin.service_facts:

# Match on units, not packages: Ubuntu 24.04's transitional 'ntp' package ships no ntp.service.
- name: Stop and disable legacy NTP services (replaced by chrony).
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - ntp
    - ntpsec
  when: (item + '.service') in ansible_facts.services

- name: Remove legacy NTP packages (replaced by chrony).
  ansible.builtin.apt:
    name:
      - ntp
      - ntpsec
      - ntpsec-ntpdate
    state: absent
