---
- name: Validate inputs.
  ansible.builtin.import_tasks: validate-inputs.yml

- name: Set up Debian (when OS is Debian based)
  ansible.builtin.include_tasks: setup-Debian.yml
  when: ansible_facts['os_family'] == 'Debian'

# The Spin dynamic inventory derives server_hostname from each server's server_name.
- name: Set the hostname.
  ansible.builtin.include_tasks: hostname.yml
  when: server_hostname is defined

# Skipped in containers because swap changes affect the host kernel.
- name: Configure swap space.
  ansible.builtin.include_tasks: swap.yml
  when:
    - swap_enabled | bool
    - ansible_facts['virtualization_type'] | default('') not in ['docker', 'container', 'containerd', 'podman', 'lxc']

- name: Configure email alerts.
  ansible.builtin.include_tasks: email-alerts.yml

- name: Setup MOTD.
  ansible.builtin.include_tasks: motd.yml

- name: Apply security policies to the server.
  ansible.builtin.include_tasks: security.yml

- name: Configure server users.
  ansible.builtin.include_tasks: users.yml