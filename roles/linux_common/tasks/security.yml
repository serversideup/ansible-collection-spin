- name: Ensure SSH configurations are up to date.
  ansible.builtin.template:
    src: "etc/ssh/sshd_config.d/{{ item }}.j2"
    dest: "/etc/ssh/sshd_config.d/{{ item }}"
    owner: root
    group: root
    mode: 0600
  notify: Restart ssh
  with_items: 
    - 01-spin-secure-ssh.conf
    - 02-spin-ssh-tunnels.conf

- name: Ensure PermitRootLogin is removed from sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PermitRootLogin'
    state: absent
  notify: Restart ssh

- name: Configure sudo access for sudo group
  ansible.builtin.lineinfile:
    dest: /etc/sudoers
    state: "{{ 'present' if use_passwordless_sudo | default(false) else 'absent' }}"
    regexp: '^%sudo\s+ALL=\(ALL\)\s+NOPASSWD:\s+ALL'
    line: '%sudo ALL=(ALL) NOPASSWD: ALL'
    validate: '/usr/sbin/visudo -cf %s'

# The drop-in keeps /etc/sudoers distro-owned. Leaving 'sudo_timestamp_timeout' unset
# means the setting isn't managed at all, so sudo keeps its own default.
- name: Configure how long sudo caches credentials.
  ansible.builtin.template:
    src: etc/sudoers.d/spin-timestamp-timeout.j2
    dest: /etc/sudoers.d/spin-timestamp-timeout
    owner: root
    group: root
    mode: "0440"
    validate: '/usr/sbin/visudo -cf %s'
  when: sudo_timestamp_timeout is defined

- name: Remove the sudo credential cache configuration when it is no longer set.
  ansible.builtin.file:
    path: /etc/sudoers.d/spin-timestamp-timeout
    state: absent
  when: sudo_timestamp_timeout is not defined

- name: Open the firewall port for SSH.
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port }}"
    proto: "tcp"
    comment: "Allow SSH connections."
  notify: Enable ufw

- name: Ensure umask is set in /etc/login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^UMASK'
    line: 'UMASK 022'
    state: present

- name: Disable USERGROUPS_ENAB in /etc/login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^USERGROUPS_ENAB'
    line: 'USERGROUPS_ENAB no'
    state: present

- name: Set umask in /etc/profile
  ansible.builtin.lineinfile:
    path: /etc/profile
    line: 'umask 022'
    state: present