---
- name: Create postmap hash
  ansible.builtin.command: postmap /etc/postfix/sasl_passwd
  when: postfix_relayhost is defined
  notify: Restart postfix

- name: Enable ufw
  community.general.ufw:
    state: enabled

- name: Restart chrony
  ansible.builtin.service:
    name: chrony
    state: restarted

- name: Restart cron
  ansible.builtin.service:
    name: cron
    state: restarted

- name: Restart postfix
  ansible.builtin.service:
    name: postfix
    state: restarted

- name: Restart ssh
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: Run newaliases
  ansible.builtin.command: newaliases

# Skipped in containers, where loading rules would change the host kernel's audit rules
- name: Load audit rules
  ansible.builtin.command: augenrules --load
  when: ansible_facts['virtualization_type'] | default('') not in ['docker', 'container', 'containerd', 'podman', 'lxc']

# auditd refuses a systemd restart, but rereads its config on this signal
- name: Reload auditd
  ansible.builtin.command: auditctl --signal reload
  when: ansible_facts['virtualization_type'] | default('') not in ['docker', 'container', 'containerd', 'podman', 'lxc']

- name: Restart crowdsec
  ansible.builtin.service:
    name: crowdsec
    state: restarted

- name: Restart crowdsec-firewall-bouncer
  ansible.builtin.service:
    name: crowdsec-firewall-bouncer
    state: restarted
