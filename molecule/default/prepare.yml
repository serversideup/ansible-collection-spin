---
- name: Prepare
  hosts: all
  become: true
  vars:
    ubuntu_has_legacy_ntp: >-
      {{ ansible_distribution == 'Ubuntu' and ansible_distribution_version is version('26.04', '<') }}
  tasks:
    # Ubuntu 26.04+ has no 'ntp' package, so those versions test the clean-install path instead.
    # Debian ships ntpsec directly, so it tests that migration path.
    - name: Install legacy NTP package to test the migration to chrony.
      ansible.builtin.apt:
        name: "{{ 'ntpsec' if ansible_distribution == 'Debian' else 'ntp' }}"
        state: present
        update_cache: true
      when: ansible_distribution == 'Debian' or ubuntu_has_legacy_ntp | bool

    # The 'ntp' package is transitional to ntpsec on 24.04, so the service name differs.
    - name: Start legacy NTP service to test the migration to chrony.
      ansible.builtin.service:
        name: >-
          {{ 'ntp' if ansible_distribution == 'Ubuntu' and ansible_distribution_version is version('24.04', '<')
          else 'ntpsec' }}
        state: started
        enabled: true
      when: ansible_distribution == 'Debian' or ubuntu_has_legacy_ntp | bool
