---
- name: Prepare
  hosts: all
  become: true
  tasks:
    # Preinstall the legacy NTP daemon so converge exercises the migration
    # to chrony. Ubuntu 26.04+ no longer ships the 'ntp' package, so those
    # versions test the clean-install path instead.
    - name: Install legacy NTP package to test the migration to chrony.
      ansible.builtin.apt:
        name: ntp
        state: present
        update_cache: true
      when: ansible_distribution_version is version('26.04', '<')

    # On 22.04 'ntp' provides the ntp service. On 24.04 'ntp' is a
    # transitional package that installs ntpsec instead.
    - name: Start legacy NTP service to test the migration to chrony.
      ansible.builtin.service:
        name: "{{ 'ntp' if ansible_distribution_version is version('24.04', '<') else 'ntpsec' }}"
        state: started
        enabled: true
      when: ansible_distribution_version is version('26.04', '<')
