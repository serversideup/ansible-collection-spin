---
- name: Prepare
  hosts: all
  become: true
  tasks:
    # Ubuntu 26.04+ has no 'ntp' package, so those versions test the clean-install path instead.
    - name: Install legacy NTP package to test the migration to chrony.
      ansible.builtin.apt:
        name: ntp
        state: present
        update_cache: true
      when: ansible_distribution_version is version('26.04', '<')

    # The 'ntp' package is transitional to ntpsec on 24.04, so the service name differs.
    - name: Start legacy NTP service to test the migration to chrony.
      ansible.builtin.service:
        name: "{{ 'ntp' if ansible_distribution_version is version('24.04', '<') else 'ntpsec' }}"
        state: started
        enabled: true
      when: ansible_distribution_version is version('26.04', '<')
