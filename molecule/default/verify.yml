---
- name: Verify
  hosts: all
  gather_facts: false
  vars_files:
    - vars.yml
  tasks:
    - name: Check current timezone.
      ansible.builtin.command: timedatectl show --property=Timezone --value
      register: current_timezone
      changed_when: false

    - name: Assert timezone is correct.
      ansible.builtin.assert:
        that:
          - current_timezone.stdout == server_timezone
        fail_msg: "Timezone is not set correctly"

    - name: Get Charlie user info.
      ansible.builtin.user:
        name: charlie
      register: charlie_user_test

    - name: Assert charlie user exists.
      ansible.builtin.assert:
        that:
          - charlie_user_test.name == 'charlie'
          - charlie_user_test.changed == false
        fail_msg: "Failed to assert the user 'charlie' exists."

    - name: Check to see if the docker user exists.
      ansible.builtin.getent:
        database: passwd
        key: "{{ docker_user.username }}"
      register: docker_user_check

    - name: Assert docker user from vars exists.
      ansible.builtin.assert:
        that:
          - docker_user_check is succeeded
        fail_msg: "Failed to assert the docker user '{{ docker_user.username }}' exists."

    - name: Get Docker user info.
      ansible.builtin.user:
        name: "{{ docker_user.username }}"
      register: docker_user_test

    - name: Assert docker user exists.
      ansible.builtin.assert:
        that:
          - docker_user_test.name == docker_user.username
          - docker_user_test.changed == false
        fail_msg: "Failed to assert the Docker user exists."

    - name: Get Docker & Docker Swarm info.
      community.docker.docker_swarm_info:
      ignore_errors: true
      register: docker_info

    - name: Assert Docker is installed and it's a swarm manager.
      ansible.builtin.assert:
        that:
          - docker_info.docker_swarm_active == true
          - docker_info.docker_swarm_manager == true
        fail_msg: "Failed to assert Docker Swarm was initialized."

    ###########################################
    # Chrony / NTP Migration Verification
    ###########################################

    - name: Gather package facts.
      ansible.builtin.package_facts:
        manager: apt

    - name: Assert chrony is installed and legacy NTP daemons are removed.
      ansible.builtin.assert:
        that:
          - "'chrony' in ansible_facts.packages"
          - "'ntp' not in ansible_facts.packages"
          - "'ntpsec' not in ansible_facts.packages"
        fail_msg: "Expected chrony to be installed and ntp/ntpsec to be removed."

    - name: Check for running legacy NTP processes.
      ansible.builtin.command: pgrep -x ntpd
      register: legacy_ntp_process
      changed_when: false
      failed_when: false

    - name: Assert no legacy NTP daemon is running.
      ansible.builtin.assert:
        that:
          - legacy_ntp_process.rc != 0
        fail_msg: "A legacy ntpd process is still running after migration to chrony."

    - name: Read custom chrony sources file.
      ansible.builtin.slurp:
        src: /etc/chrony/sources.d/spin.sources
      register: spin_sources_file
      when: chrony_ntp_servers is defined

    - name: Assert custom NTP servers are configured.
      ansible.builtin.assert:
        that:
          - "'server time.cloudflare.com iburst' in spin_sources_file.content | b64decode"
          - "'pool 0.pool.ntp.org iburst' in spin_sources_file.content | b64decode"
        fail_msg: "Custom NTP servers are not rendered correctly in /etc/chrony/sources.d/spin.sources."
      when: chrony_ntp_servers is defined

    ###########################################
    # Swap Container-Safety Verification
    ###########################################

    # Only pins the container gate - functional swap tests live in the swap-integration scenario.
    - name: Check for a swap file.
      ansible.builtin.stat:
        path: /swapfile
      register: swap_file_check

    - name: Assert no swap file was created in the container.
      ansible.builtin.assert:
        that:
          - not swap_file_check.stat.exists
        fail_msg: "A swap file should never be created inside containers."

    ###########################################
    # Postfix SASL Configuration Verification
    ###########################################

    - name: Check if Postfix sasl_passwd file exists.
      ansible.builtin.stat:
        path: /etc/postfix/sasl_passwd
      register: sasl_passwd_file

    - name: Assert Postfix sasl_passwd file exists.
      ansible.builtin.assert:
        that:
          - sasl_passwd_file.stat.exists
          - sasl_passwd_file.stat.mode == "0600"
        fail_msg: "Postfix sasl_passwd file does not exist or has incorrect permissions"
      when: postfix_relayhost is defined

    - name: Check if Postfix sasl_passwd.db hash file exists.
      ansible.builtin.stat:
        path: /etc/postfix/sasl_passwd.db
      register: sasl_passwd_db_file

    - name: Assert Postfix sasl_passwd.db hash file exists.
      ansible.builtin.assert:
        that:
          - sasl_passwd_db_file.stat.exists
        fail_msg: "Postfix sasl_passwd.db hash file does not exist"
      when: postfix_relayhost is defined

    - name: Check Postfix main.cf for SASL configuration.
      ansible.builtin.command: postconf smtp_sasl_auth_enable
      register: postfix_sasl_check
      changed_when: false
      when: postfix_relayhost is defined

    - name: Assert Postfix SASL authentication is enabled.
      ansible.builtin.assert:
        that:
          - "'yes' in postfix_sasl_check.stdout"
        fail_msg: "Postfix SASL authentication is not enabled"
      when: postfix_relayhost is defined

    - name: Check Postfix main.cf for relayhost configuration.
      ansible.builtin.command: postconf relayhost
      register: postfix_relayhost_check
      changed_when: false
      when: postfix_relayhost is defined

    - name: Assert Postfix relayhost is configured.
      ansible.builtin.assert:
        that:
          - "postfix_relayhost in postfix_relayhost_check.stdout"
        fail_msg: "Postfix relayhost is not configured correctly"
      when: postfix_relayhost is defined

    - name: Check if libsasl2-modules package is installed.
      ansible.builtin.command: dpkg -l libsasl2-modules
      register: libsasl2_check
      changed_when: false
      failed_when: false
      when: postfix_relayhost is defined

    - name: Assert libsasl2-modules package is installed.
      ansible.builtin.assert:
        that:
          - libsasl2_check.rc == 0
        fail_msg: "libsasl2-modules package is not installed"
      when: postfix_relayhost is defined