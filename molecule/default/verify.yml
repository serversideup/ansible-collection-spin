---
- name: Verify
  hosts: all
  gather_facts: false
  vars_files:
    - vars.yml
  tasks:
    - name: Check current timezone.
      ansible.builtin.command: timedatectl show --property=Timezone --value
      register: current_timezone
      changed_when: false

    - name: Assert timezone is correct.
      ansible.builtin.assert:
        that:
          - current_timezone.stdout == server_timezone
        fail_msg: "Timezone is not set correctly"

    - name: Get Charlie user info.
      ansible.builtin.user:
        name: charlie
      register: charlie_user_test

    - name: Assert charlie user exists.
      ansible.builtin.assert:
        that:
          - charlie_user_test.name == 'charlie'
          - charlie_user_test.changed == false
        fail_msg: "Failed to assert the user 'charlie' exists."

    - name: Check to see if the docker user exists.
      ansible.builtin.getent:
        database: passwd
        key: "{{ docker_user.username }}"
      register: docker_user_check

    - name: Assert docker user from vars exists.
      ansible.builtin.assert:
        that:
          - docker_user_check is succeeded
        fail_msg: "Failed to assert the docker user '{{ docker_user.username }}' exists."

    - name: Get Docker user info.
      ansible.builtin.user:
        name: "{{ docker_user.username }}"
      register: docker_user_test

    - name: Assert docker user exists.
      ansible.builtin.assert:
        that:
          - docker_user_test.name == docker_user.username
          - docker_user_test.changed == false
        fail_msg: "Failed to assert the Docker user exists."

    - name: Get Docker & Docker Swarm info.
      community.docker.docker_swarm_info:
      ignore_errors: true
      register: docker_info

    - name: Assert Docker is installed and it's a swarm manager.
      ansible.builtin.assert:
        that:
          - docker_info.docker_swarm_active == true
          - docker_info.docker_swarm_manager == true
        fail_msg: "Failed to assert Docker Swarm was initialized."

    ###########################################
    # Sudo Credential Cache Verification
    ###########################################

    - name: Check the sudo credential cache drop-in.
      ansible.builtin.stat:
        path: /etc/sudoers.d/spin-timestamp-timeout
      register: sudo_timestamp_file

    - name: Read the sudo credential cache drop-in.
      ansible.builtin.slurp:
        src: /etc/sudoers.d/spin-timestamp-timeout
      register: sudo_timestamp_contents

    - name: Assert the sudo credential cache timeout is configured.
      ansible.builtin.assert:
        that:
          - sudo_timestamp_file.stat.exists
          - sudo_timestamp_file.stat.pw_name == 'root'
          - sudo_timestamp_file.stat.gr_name == 'root'
          - sudo_timestamp_file.stat.mode == "0440"
          - "('Defaults timestamp_timeout=' ~ sudo_timestamp_timeout) in (sudo_timestamp_contents.content | b64decode)"
        fail_msg: "The sudo credential cache timeout was not written to /etc/sudoers.d/spin-timestamp-timeout."

    - name: Validate the sudoers drop-in with visudo.
      ansible.builtin.command: /usr/sbin/visudo -cf /etc/sudoers.d/spin-timestamp-timeout
      changed_when: false

    ###########################################
    # Chrony / NTP Migration Verification
    ###########################################

    - name: Gather package facts.
      ansible.builtin.package_facts:
        manager: apt

    - name: Assert chrony is installed and legacy NTP daemons are removed.
      ansible.builtin.assert:
        that:
          - "'chrony' in ansible_facts.packages"
          - "'ntp' not in ansible_facts.packages"
          - "'ntpsec' not in ansible_facts.packages"
        fail_msg: "Expected chrony to be installed and ntp/ntpsec to be removed."

    - name: Check for running legacy NTP processes.
      ansible.builtin.command: pgrep -x ntpd
      register: legacy_ntp_process
      changed_when: false
      failed_when: false

    - name: Assert no legacy NTP daemon is running.
      ansible.builtin.assert:
        that:
          - legacy_ntp_process.rc != 0
        fail_msg: "A legacy ntpd process is still running after migration to chrony."

    - name: Read custom chrony sources file.
      ansible.builtin.slurp:
        src: /etc/chrony/sources.d/spin.sources
      register: spin_sources_file
      when: chrony_ntp_servers is defined

    - name: Assert custom NTP servers are configured.
      ansible.builtin.assert:
        that:
          - "'server time.cloudflare.com iburst' in spin_sources_file.content | b64decode"
          - "'pool 0.pool.ntp.org iburst' in spin_sources_file.content | b64decode"
        fail_msg: "Custom NTP servers are not rendered correctly in /etc/chrony/sources.d/spin.sources."
      when: chrony_ntp_servers is defined

    ###########################################
    # Unattended Upgrades Verification
    ###########################################

    - name: Read unattended-upgrades configuration.
      ansible.builtin.slurp:
        src: /etc/apt/apt.conf.d/50unattended-upgrades
      register: unattended_upgrades_file

    - name: Assert automatic reboots are off by default.
      ansible.builtin.assert:
        that:
          - "'Unattended-Upgrade::Automatic-Reboot \"false\";' in unattended_upgrades_file.content | b64decode"
          - "'Unattended-Upgrade::Automatic-Reboot-Time \"04:00\";' in unattended_upgrades_file.content | b64decode"
        fail_msg: "Automatic reboot settings are not rendered correctly in /etc/apt/apt.conf.d/50unattended-upgrades."

    - name: Gather distribution facts.
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - "!min"
          - distribution

    # Automatic-Reboot only fires when /var/run/reboot-required exists, which this hook creates on Debian.
    - name: Check for the unattended-upgrades kernel hook.
      ansible.builtin.stat:
        path: /etc/kernel/postinst.d/unattended-upgrades
      register: unattended_upgrades_kernel_hook
      when: ansible_facts['distribution'] == 'Debian'

    - name: Assert the unattended-upgrades kernel hook exists.
      ansible.builtin.assert:
        that:
          - unattended_upgrades_kernel_hook.stat.exists
        fail_msg: "/etc/kernel/postinst.d/unattended-upgrades is missing, so Debian will never flag a reboot after kernel updates."
      when: ansible_facts['distribution'] == 'Debian'

    ###########################################
    # Swap Container-Safety Verification
    ###########################################

    # Only pins the container gate - functional swap tests live in the swap-integration scenario.
    - name: Check for a swap file.
      ansible.builtin.stat:
        path: /swapfile
      register: swap_file_check

    - name: Assert no swap file was created in the container.
      ansible.builtin.assert:
        that:
          - not swap_file_check.stat.exists
        fail_msg: "A swap file should never be created inside containers."

    ###########################################
    # Postfix SASL Configuration Verification
    ###########################################

    - name: Check if Postfix sasl_passwd file exists.
      ansible.builtin.stat:
        path: /etc/postfix/sasl_passwd
      register: sasl_passwd_file

    - name: Assert Postfix sasl_passwd file exists.
      ansible.builtin.assert:
        that:
          - sasl_passwd_file.stat.exists
          - sasl_passwd_file.stat.mode == "0600"
        fail_msg: "Postfix sasl_passwd file does not exist or has incorrect permissions"
      when: postfix_relayhost is defined

    - name: Check if Postfix sasl_passwd.db hash file exists.
      ansible.builtin.stat:
        path: /etc/postfix/sasl_passwd.db
      register: sasl_passwd_db_file

    - name: Assert Postfix sasl_passwd.db hash file exists.
      ansible.builtin.assert:
        that:
          - sasl_passwd_db_file.stat.exists
        fail_msg: "Postfix sasl_passwd.db hash file does not exist"
      when: postfix_relayhost is defined

    - name: Check Postfix main.cf for SASL configuration.
      ansible.builtin.command: postconf smtp_sasl_auth_enable
      register: postfix_sasl_check
      changed_when: false
      when: postfix_relayhost is defined

    - name: Assert Postfix SASL authentication is enabled.
      ansible.builtin.assert:
        that:
          - "'yes' in postfix_sasl_check.stdout"
        fail_msg: "Postfix SASL authentication is not enabled"
      when: postfix_relayhost is defined

    - name: Check Postfix main.cf for relayhost configuration.
      ansible.builtin.command: postconf relayhost
      register: postfix_relayhost_check
      changed_when: false
      when: postfix_relayhost is defined

    - name: Assert Postfix relayhost is configured.
      ansible.builtin.assert:
        that:
          - "postfix_relayhost in postfix_relayhost_check.stdout"
        fail_msg: "Postfix relayhost is not configured correctly"
      when: postfix_relayhost is defined

    - name: Check if libsasl2-modules package is installed.
      ansible.builtin.command: dpkg -l libsasl2-modules
      register: libsasl2_check
      changed_when: false
      failed_when: false
      when: postfix_relayhost is defined

    - name: Assert libsasl2-modules package is installed.
      ansible.builtin.assert:
        that:
          - libsasl2_check.rc == 0
        fail_msg: "libsasl2-modules package is not installed"
      when: postfix_relayhost is defined

    ###########################################
    # Docker Daemon Configuration Verification
    ###########################################

    - name: Read the Docker daemon configuration.
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: docker_daemon_config_file

    - name: Assert log rotation and metrics are configured.
      ansible.builtin.assert:
        that:
          - docker_daemon_config['log-driver'] == 'local'
          - docker_daemon_config['metrics-addr'] == docker_metrics_addr
        fail_msg: "The Docker daemon configuration is missing log rotation or metrics settings"
      vars:
        docker_daemon_config: "{{ docker_daemon_config_file.content | b64decode | from_json }}"

    - name: Get the running Docker daemon's settings.
      community.docker.docker_host_info:
      register: docker_host_settings

    - name: Assert Docker is running with the local logging driver.
      ansible.builtin.assert:
        that:
          - docker_host_settings.host_info.LoggingDriver == 'local'
        fail_msg: "Docker is not using the local logging driver"

    - name: Check the Docker metrics endpoint.
      ansible.builtin.uri:
        url: "http://{{ docker_metrics_addr }}/metrics"
        return_content: false
      register: docker_metrics_check

    - name: Assert the Docker metrics endpoint responds.
      ansible.builtin.assert:
        that:
          - docker_metrics_check.status == 200
        fail_msg: "Docker is not serving metrics on {{ docker_metrics_addr }}"

    ###########################################
    # Audit Logging Verification
    ###########################################

    - name: Gather package facts for auditd.
      ansible.builtin.package_facts:
        manager: auto

    - name: Read the audit rules.
      ansible.builtin.slurp:
        src: /etc/audit/rules.d/50-spin.rules
      register: audit_rules_file

    - name: Read the auditd configuration.
      ansible.builtin.slurp:
        src: /etc/audit/auditd.conf
      register: auditd_conf_file

    - name: Assert auditd is installed and configured.
      ansible.builtin.assert:
        that:
          - "'auditd' in ansible_facts.packages"
          - "'-k identity' in audit_rules"
          - "'-k sudoers' in audit_rules"
          - "'-w /home/alice/.ssh/ -p wa -k ssh_keys' in audit_rules"
          - "'-w /home/dockeruser/.ssh/ -p wa -k ssh_keys' in audit_rules"
          - "'-k exec_tmp' in audit_rules"
          - "'-F euid=0 -F auid>=1000 -F auid!=unset -k root_command' in audit_rules"
          - "auditd_conf is search('(?m)^max_log_file = 50$')"
          - "auditd_conf is search('(?m)^num_logs = 10$')"
          - "auditd_conf is search('(?m)^max_log_file_action = ROTATE$')"
        fail_msg: "auditd is not installed or its rules and rotation are not configured"
      vars:
        audit_rules: "{{ audit_rules_file.content | b64decode }}"
        auditd_conf: "{{ auditd_conf_file.content | b64decode }}"

    - name: Check that alice's SSH folder exists to be watched.
      ansible.builtin.stat:
        path: /home/alice/.ssh
      register: alice_ssh_dir

    - name: Assert alice's SSH folder exists.
      ansible.builtin.assert:
        that:
          - alice_ssh_dir.stat.isdir
          - alice_ssh_dir.stat.mode == '0700'
        fail_msg: "alice's SSH folder is missing or has the wrong permissions"

    ###########################################
    # CrowdSec Verification
    ###########################################

    - name: Check the CrowdSec, bouncer, and fail2ban services.
      ansible.builtin.command: "systemctl is-active {{ item }}"
      loop:
        - crowdsec
        - crowdsec-firewall-bouncer
        - fail2ban
      register: crowdsec_services
      changed_when: false
      failed_when: false

    - name: Assert CrowdSec replaced fail2ban.
      ansible.builtin.assert:
        that:
          - crowdsec_services.results[0].stdout == 'active'
          - crowdsec_services.results[1].stdout == 'active'
          - crowdsec_services.results[2].stdout != 'active'
        fail_msg: "CrowdSec or its bouncer isn't running, or fail2ban is still running"

    - name: Read the MOTD services script.
      ansible.builtin.slurp:
        src: /etc/update-motd.d/40-services
      register: motd_services_script

    - name: Assert the MOTD shows CrowdSec instead of fail2ban.
      ansible.builtin.assert:
        that:
          - "'crowdsec' in (motd_services_script.content | b64decode)"
          - "'fail2ban' not in (motd_services_script.content | b64decode)"
        fail_msg: "The MOTD services list still shows fail2ban instead of CrowdSec"

    - name: List CrowdSec bouncers.
      ansible.builtin.command: cscli bouncers list -o json
      register: crowdsec_bouncers
      changed_when: false

    - name: Check whether CrowdSec registered with its central API.
      ansible.builtin.stat:
        path: /etc/crowdsec/online_api_credentials.yaml
      register: crowdsec_capi_file

    - name: List CrowdSec collections.
      ansible.builtin.command: cscli collections list -o json
      register: crowdsec_collections_check
      changed_when: false

    - name: Read the CrowdSec simulation settings.
      ansible.builtin.slurp:
        src: /etc/crowdsec/simulation.yaml
      register: crowdsec_simulation_file

    - name: Read the firewall rules.
      ansible.builtin.command: iptables -S
      register: crowdsec_iptables
      changed_when: false

    - name: List CrowdSec log sources.
      ansible.builtin.find:
        paths: /etc/crowdsec/acquis.d
        patterns: "*sshd*.yaml"
      register: crowdsec_ssh_sources

    - name: Read Spin's CrowdSec allowlist.
      ansible.builtin.command: cscli allowlists inspect spin -o json
      register: crowdsec_allowlist_check
      changed_when: false

    - name: Check for the old parser allowlist.
      ansible.builtin.stat:
        path: /etc/crowdsec/parsers/s02-enrich/spin-allowlist.yaml
      register: crowdsec_parser_allowlist

    - name: Assert the allowlist matches crowdsec_allowlist.
      ansible.builtin.assert:
        that:
          - crowdsec_allowlist_values | sort == ['198.51.100.0/24', '203.0.113.10']
          - not crowdsec_parser_allowlist.stat.exists
        fail_msg: "Spin's CrowdSec allowlist doesn't match crowdsec_allowlist, or the old parser allowlist remains"
      vars:
        crowdsec_allowlist_values: "{{ (crowdsec_allowlist_check.stdout | from_json)['items'] | map(attribute='value') | list }}"

    - name: Assert CrowdSec is configured privacy-first with Docker protection.
      ansible.builtin.assert:
        that:
          - (crowdsec_bouncers.stdout | from_json) | length > 0
          - crowdsec_capi_file.stat.size == 0
          - "'crowdsecurity/traefik' in crowdsec_collection_names"
          - "'crowdsecurity/http-cve' in crowdsec_collection_names"
          - "'simulation: true' in crowdsec_simulation"
          - "'crowdsecurity/ssh-bf' in crowdsec_simulation"
          - crowdsec_iptables.stdout is search('-A INPUT .*CROWDSEC')
          - crowdsec_iptables.stdout is search('-A DOCKER-USER .*CROWDSEC')
          - crowdsec_ssh_sources.matched == 1
        fail_msg: "CrowdSec isn't registered with its bouncer, is sharing, or is missing Docker protection"
      vars:
        crowdsec_collection_names: "{{ (crowdsec_collections_check.stdout | from_json).collections | map(attribute='name') | list }}"
        crowdsec_simulation: "{{ crowdsec_simulation_file.content | b64decode }}"
